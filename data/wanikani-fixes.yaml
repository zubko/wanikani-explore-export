# Corrections for the downloaded WaniKani subject data, applied by `bun run patch-subjects`.
#
# WaniKani's content update of 2026-08-27 changed the radical composition of 万, 別 and 成.
# The website shows the new radicals and the API serves the new mnemonics, but the API still
# serves the old `component_subject_ids`, and the radicals' `amalgamation_subject_ids` still
# point the old way. So 別 reads Mouth + Sword + Knife while its own mnemonic talks about a
# prison, and no radical lists 万 or 別 at all.
#
# Reported: https://community.wanikani.com/t/75554  and hello@wanikani.com (2026-09-11)
#
# `seen` is the subject's `data_updated_at` when the patch was written. A run fails if
# WaniKani touched the record at all. That failure is a prompt to look, never an instruction
# to delete. Open the subject on wanikani.com, then either:
#   - delete the patch, if WaniKani fixed this field
#   - update `seen` and re-check `expect`, if they changed something else
# Never delete a patch just because the run failed.

